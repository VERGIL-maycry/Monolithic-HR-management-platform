databases:
  - name: hr-platform-db
    databaseName: hr_platform
    user: hr_platform
    plan: basic-256mb

services:
  - type: web
    name: hr-platform-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hr-platform-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: APP_CORS_ALLOWED_ORIGIN_PATTERNS
        value: http://localhost:5173,https://*.vercel.app
