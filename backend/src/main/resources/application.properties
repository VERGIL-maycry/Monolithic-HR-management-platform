spring.application.name=hr-platform
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hr_platform}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:hr_platform}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:hr_platform}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
app.jwt.secret=${JWT_SECRET:change-this-secret-key-must-be-at-least-256-bits-long-for-hs256}
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,https://*.vercel.app}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true